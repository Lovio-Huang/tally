name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; a compromised step can't push or publish.
# Actions are pinned to full commit SHAs: a tag like v7 can be moved to point at other
# code, a commit can't. The comment keeps the version readable, and Dependabot updates both.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Python ${{ matrix.python }} (real Postgres via Testcontainers)
    # Pinned rather than ubuntu-latest, so the OS changes in a PR of our own, not under us.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"] # the oldest version pyproject.toml promises, and the newest (the image's)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -e ".[dev]"
      - if: matrix.python == '3.14'
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest -q --cov # fails under 90% branch coverage (pyproject.toml)
      - if: matrix.python == '3.14'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - if: matrix.python == '3.14'
        run: node --test 'tests/js/*.test.js'

  load-test:
    name: Docker Compose + load test + reconciliation
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A password for the API's database role, random per run and masked in logs
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "TALLY_APP_DB_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start the stack and wait until the app's health check passes
        run: docker compose up -d --build --wait
      - name: Concurrent transfers (fails on any 5xx, timeout or unbalanced books)
        run: |
          # Creating clients is an admin command: it runs as the schema owner, not as the API's role.
          export TALLY_API_KEY=$(docker compose run --rm -T admin tally create-client loadtest)
          python3 scripts/load_test.py --requests 2000 --concurrency 30
      - name: The books still balance, recomputed from raw entries
        run: docker compose exec -T app tally reconcile
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
